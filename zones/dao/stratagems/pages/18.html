<h1><small>15</small>. Сманить тигра с горы на равнину.</h1>

<span class='clPinyin'>diào hǔ lí shān</span><br>
<span class='clTranslation'>перемещать тигр расставаться гора</span><br>
<br>
Никогда не атаковать противника, преимущество которого в его позиции. Вместо этого выманить его с выигрышной позиции, тем самым отделяя от источника силы.<br>
