<h6>buddhism theravada</h6>

<h1>Четыре благородные истины</h1>


<h2>Страдание</h2>
&emsp;Существование есть страдание.  <br>

<h2>Возникновение страдания</h2>
&emsp;Влечение рождает страдание.  <br>

<h2>Пресечение страдания</h2>
&emsp;Угасание влечения есть конец страдания.  <br>

<h2>Путь пресечения страдания</h2>
&emsp;Есть путь к угасанию влечения.  <br>
