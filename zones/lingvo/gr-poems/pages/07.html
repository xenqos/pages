<h6>мои стихи на букву ч</h6>

<h1>Sept</h1>

<h3>чемульпо чâстушки</h3>

<b>/ моряк с крейсера варяг /</b><br>
<br>
чâпая чрез чемульпо чâстенько<br>
черемшу чесночную чâлдоня<br>
чтишь чубатого черезвычайщика<br>
чопорного чухая чмыря<br>
<br>
через чемульпо чâстенько чâпая<br>
чуешь черезмерность черноты<br>
чâлишь челноки чудаковатые<br>
чечевицой чмокая чтеца<br>
