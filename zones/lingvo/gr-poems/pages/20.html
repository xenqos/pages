<h6>Намётки</h6>

<h1>печаль</h1>

едва победишь<br>
проиграешь сразу<br>
станешь счастливым<br>
кто-то горько заплачет<br>
стою у моря<br>
смахиваю ладонью<br>
солёные капли<br>
у глаз<br>
