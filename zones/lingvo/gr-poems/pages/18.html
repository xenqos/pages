<h6>Намётки</h6>

<h1>приключения поэта кокосова</h1>

/ из незаконченного /<br>
<br>
поэт кокосов<br>
вставши спозаранку<br>
попил чайку<br>
и сел писать стихов<br>
<br>
прервавшись<br>
через час<br>
и выйдя из квартиры…<br>
<br>
мадам кокосова тем время<br>
решила на базар сходить…<br>
