<h6>мои стихи на букву ч</h6>

<h1>Cinq</h1>

<h3>/ чудаковатый чертёжник /</h3>

чекрыжить черевато чудаков<br>
чертой чрезмерной чâпая<br>
чуть что чураясь чâр<br>
чьих чуткость<br>
чмокая читает человек<br>
черкнув число чернильным чертежом<br>
