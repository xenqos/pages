<h6>мои стихи на букву ч</h6>

<h1>Six</h1>

<h3>чукотская чужбина</h3>

<b>/ чиновник в изгнаньи /</b><br>
<br>
чураясь чертогов червлёных<br>
чрез чёрные чâщи чâстенько<br>
черёмухи чуешь чâхотку<br>
чâпыжника чâлого чудь<br>
<br>
чутка чâю чёрного чâпнешь<br>
чâдишь чâбрецом черезмерно<br>
чукотская чуткая челядь<br>
чâстично членует челнок<br>
