<h6>Предло̀зи</h6>

<h1>на цел</h1>

<blockquote>
Въпросѝтелни ду̀ми:<br>
<span class='r'>каква̀ цел</span><br>
</blockquote>

Пра̀вя го <span class='r'>без</span> цел.<br>
Пра̀вя го <span class='r'>в</span> тво̀я чест.<br>
Пра̀вя го <span class='r'>за</span> теб.<br>
Пра̀вя <span class='r'>го зарадѝ</span> теб.<br>
Пра̀вя го <span class='r'>напу̀к</span>.<br>
Пра̀вя го <span class='r'>с</span> цел.<br>
Ще рабо̀тя <span class='r'>срещу̀</span> нѐго.<br>
Ще го постѝгна <span class='r'>чрез</span> нѐго.<br>
