<h6>Grammar</h6>

<h1>Sandhi: 不 bù</h1>

不 bù becomes 2nd tone before a 4th tone.<br>
<br>
<span class='t4'>不</span><span class='t4'>是</span> &ensp; bù shì &ensp; not to be<br>
<span class='t2'>不</span><span class='t4'>是</span> &ensp; bú shì<br>
<br>
<span class='t4'>不</span><span class='t4'>对</span> &ensp; bù duì &ensp; not correct<br>
<span class='t2'>不</span><span class='t4'>对</span> &ensp; bú duì<br>
<br>
<span class='t4'>不</span><span class='t4'>要</span> &ensp; bù yào &ensp; not to want<br>
<span class='t2'>不</span><span class='t4'>要</span> &ensp; bú yào<br>
