<div>
<p class="ded">T<small>HEREFORE</small> I <small>SAY UNTO</small> T<small>HEE: COME FORTH UNTO ME FROM THINE ABODE IN THE</small> S<small>ILENCE, UNUTTERABLE</small> W<small>ISDOM</small>, A<small>LL-LIGHT</small>, A<small>LL-POWER</small>! T<small>HOTH</small>, H<small>ERMES</small>, M<small>ERCURY</small>, O<small>DIN, BY WHATEVER NAME</small> I <small>CALL</small> T<small>HEE</small>, T<small>HOU ART STILL UN-NAMED AND NAMELESS TO</small> E<small>TERNITY</small>! C<small>OME THOU FORTH</small>, I <small>SAY, AND AID AND GUARD ME IN THIS</small> W<small>ORK OF</small> A<small>RT</small>.<sup><a href="notes.xhtml#fat1" id="fan1">1</a></sup></p>
</div>
