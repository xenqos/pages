<h6>Четыре благородные истины</h6>


<h1>Истины</h1>

<h2>Тягота</h2>
&ensp;&ensp;Существование есть тягота.<br>

<h2>Сложение тяготы</h2>
&ensp;&ensp;Влечение рождает тяготу.<br>

<h2>Пресечение тяготы</h2>
&ensp;&ensp;Угасание влечения есть конец тяготы.<br>

<h2>Путь пресечения тяготы</h2>
&ensp;&ensp;Есть путь к угасанию влечения.<br>
