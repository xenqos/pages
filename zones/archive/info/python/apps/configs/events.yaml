title : Events Calendar
zone  : fn

date_current :

url_events : https://sslecal2.forexprostools.com/

#  Countries
#  4 - UK
#  5 - US
#  6 - Canada
# 12 - Suiss
# 17 - Germany
# 22 - France
# 72 - EU

#  TimeZone
#  55 - UTC
#  8  - EST
#  68 - EET

param_importance : &param_i '2,3'
param_countries  : &param_c '5,17,22,72'
param_timezone   : &param_t '55'

params_events :
  calType     : week
  columns     : exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous
  category    : _employment,_economicActivity,_inflation,_credit,_centralBanks,_confidenceIndex,_balance,_Bonds
  importance  : *param_i
  countries   : *param_c
  timeZone    : *param_t
  lang        : '1'

rgx_evnt_body : '<tbody(.*?)>(.*?)</tbody>'
rgx_evnt_time : '<span class="event_time">(.*?)</span>'
rgx_evnt_date : 'id="theDay(.*?)">(.*?)</td>'

rgxs_evnts:
  - ['\n\s+', '\n']
  - ['onclick="(.*?)"', '']
  - ['\s+>', '>']
  - ['\s+<', '<']
  - ['<tr', '\n<tr']
  - ['</tr', '\n</tr']
  - ['<td', '\n<td']
  - ['<td(.*?)theDay(.*?)/td>', '']
  - [' event_(.*?)="(.*?)"', '']
  - [' id="(.*?)"', '']
  - ['<i(.*?)i>', '']
  - [' Volatility Expected', '']
  - ['<tr>\s+</tr>', '']
  - [' title="Low">', '><span class="event_star"></span>']
  - [' title="Moderate">', '><span class="event_star"></span><span class="event_star">']
  - [' title="High">', '><span class="event_star"></span><span class="event_star"></span><span class="event_star"></span>']
  - [' title="(.*?)"', '']
  - ['<td colspan="8"(.*?)td>', '']
#  - ['<td(.*?)colspan="6"', '</tr><tr><td ']
#  - ['class="center time"', 'class="event_time"']
  - [' class="flagCur"', '']
  - ['ceFlags(.*?)">&nbsp;</span>', 'country_flags\1">&nbsp;</span>']
  - ['<tr class="noHover displayNone">\s+</tr>', '']
  - ['<td class="diamond(.*?)td>', '']
  - ['<span class="audioIconNew(.*?)span>', '']
  - [' class="sentiment" ', ' ']
  - ['<span(.*?)Preliminary Release(.*?)span>', '']
  - ['<table(.*?)>', '<table>']
#  - ['class="(.*?)act(.*?)', 'class="\1data_actual\2']
#  - ['class="(.*?)fore(.*?)', 'class="\1data_forecast\2']
#  - ['class="(.*?)prev(.*?)', 'class="\1data_previous\2']
#  - ['class="(.*?)bold(.*?)', 'class="\1font_bold\2']
#  - ['class="(.*?)greenFont(.*?)', 'class="\1color_green\2']
#  - ['class="(.*?)redFont(.*?)', 'class="\1color_red\2']
  - ['class="(.*?)blackFont(.*?)', 'class="\1color_black\2']
  - ['class="first left time', 'class="event_time']
  - ['class="left event', 'class="event_name']
  - ['<td class="event_name">(.*?)</td>', '<td class="event_name">\1</td></tr><tr>']
  - ['<td>&nbsp;</td></tr><tr>', '</tr><tr>']
  - ['<td class="event_name">', '</tr><tr><td class="event_name">']
  - ['</tr><tr><td', '</tr>\n<tr>\n<td']
  - ['</td></tr><tr>', '</td>\n</tr>\n<tr>']
  - ['<tr>', '<div>']
  - ['</tr>', '</div>']
  - ['<td', '<span']
  - ['</td>', '</span>']
  - [' evt(.*?)="(.*?)"', '']
  - ['\s+>', '>']
  - ['<div>\n<span class="event_time"', '\n<br>\n<div>\n<span class="event_time"']
  - ['\n\n', '\n']

list_cbrates :
  - ['US', 'https://tradingeconomics.com/united-states/interest-rate']
  - ['EU', 'https://tradingeconomics.com/euro-area/interest-rate']

regexes_cbrates:
  - ['(\s+)', ' ']
  - ['>(\s+)', '>']
  - ['(\s+)<', '<']
  - ['<table', '\n<table']
  - ['</table>', '\n</table>']
  - ['</thead>', '\n</thead>']
  - ['<th', '\n<th']
  - ['<tr', '\n<tr']
  - ['</tr>', '\n</tr>']
  - ['<td', '\n<td']
  - [' (style|title)="(.*?)"', '']
  - ['<th>Actual</th>', '<th>Act.</th>']
  - ['<th>Previous</th>', '<th>Pre.</th>']
  - ['<th>Consensus</th>', '<th>Con.</th>']
  - ['<th><span(.*?)>TEForecast</span></th>', '<th>For.</th>']
  - ['<th colspan="2">', '<th>']
  - ['<th>GMT</th>', '<th>UTC</th>']
  - ['<span class="hidden-xs">Reference</span>', 'Reference']
  - ['datatable-item ', '']
  - [' data-id="(.*?)"', '']
  - [' data-country="(.*?)"', '']
  - [' data-category="(.*?)"', '']
  - ['<td></td>', '']
  - ['<td>(\d\d)(\d\d)-(\d\d)-(\d\d)</td>', '<td>\3/\4/\2</td>']
  - ['\n\n', '\n']
