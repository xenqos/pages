clean_module      : [
                    ['<article class="js-article-item articleItem sponsoredArticle  "  >', ''],
                    ]

clean_article_pre : [
#                    ['<span class(.*?)span>', ''],
#                    ['<span id(.*?)span>', ''],
#                    ['<span style(.*?)span>', ''],
                    ]

clean_article_post: [
                    ['<aside(.*?)aside>', ''],
                    ['<video(.*?)video>', ''],
                    ['<div class="align_center">(.*?)</div>', '\1'],
                    ['<div class="contentMediaBoxBottom(.*?)">(.*?)</div>', ''],
                    ['<div class="contentMediaBox(.*?)"(.*?)>(.*?)</div>', '\3'],
                    ['<h(.*?)>(.*?)</h(.*?)>', '<em>\2</em>'],
                    ['<p data-id="(.*?)"(.*?)>(.*?)</p>', ''],
                    [' dir="ltr"', ''],
                    ['<a href="javascript(.*?)a>', ''],
                    ['<div id="imgCarousel"(.*?)>(.*?)</div>', '\2'],
                    ['<img(.*?)src="(.*?)"(.*?)>', '<a target=''_blank'' class=''clLink'' href=''\2''><img class=''clImageThumb'' src=''\2''></a>'],
                    ]
