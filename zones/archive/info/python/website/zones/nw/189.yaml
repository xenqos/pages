config_enabled  : "true"
config_type     : "link"

media_name      : "Slate.fr - Société"
media_url       : "http://www.slate.fr/societe/"
media_encode    : "false"
media_encoding  : ""

module_body     : "div[class=articles-wrapper]"
module_article  : "div[class^=article-list__content]"
module_headline : "p a"

article_body    : "article"
article_title   : "h1"
article_date    : "time"
article_author  : "a[class=author]"

clean_module:
  - ['', '']

clean_article_pre:
  - ['', '']

clean_article_post:
  - ['^(.*?)article-content-wrapper(.*?)>', '']
  - ['<div class=\"tags-container(.*)$', '']
  - ['<form(.*)form>', '']
  - ['<p class=\"article-infos(.*?)p>', '']
  - ['<span class=\"caption-picture\">(.*?)</span>/s", "$1<br><br>"]
  - ['<figure(.*?)>(.*?)</figure>/s", "$2"]
  - ['<figcaption(.*?)>(.*?)</figcaption>/s", "$2"]
  - ['<div class=\"element clearfix\">(.*?)</div>', '']
  - ['</div>', '']
  - ['<div(.*?)>', '']
  - ['<a(.*?)>(.*?)</a>/s", "$2"]
  - ['src=\"data:(.*?)\"', '']
  - ['<img draggable=\"true\"(.*?)>', '']
  - ['<img(.*?)src=\"(.*?)\"(.*?)>/s", "<a target='_blank' href='$2'><img class='clImageThumb' src='$2'></a><br>"]
