config_enabled  : "true"
config_type     : "link"

media_name      : "NYT - Opinion - Guests"
media_url       : "https://www.nytimes.com/section/opinion/contributors"
media_encode    : "false"
media_encoding  : ""

module_body     : "section[id=stream-panel]"
module_article  : "li[class=css-112uytv]"
module_headline : "h2"

article_body    : "main[id=site-content]"
article_title   : "h1"
article_date    : "time"
article_author  : "span[itemprop=name] a"

clean_module:
  - ['', '']

clean_article_pre:
  - ['', '']

clean_article_post:
  - ['<noscript(.*?)>(.*?)</noscript>/s", "$2"]
  - ['<svg(.*?)>(.*?)</svg>', '']
  - ['<path(.*?)>(.*?)</path>', '']
  - ['<button(.*?)>(.*?)</button>', '']
  - ['<aside(.*?)>(.*?)</aside>', '']
  - ['<video(.*?)>(.*?)</video>', '']
  - ['^(.*?)</h1>', '']
  - ['^(.*?)</time>', '']
  - [' (alt|decoding|href|sizes|srcset|target|title|width|height)=\"(.*?)\"', '']
  - ['<source(.*?)>', '']
  - ['<figcaption(.*?)>(.*?)</figcaption>/s", "$2<br>"]
  - ['<picture(.*?)>(.*?)</picture>/s", "$2<br><br>"]
  - ['<figure(.*?)>(.*?)</figure>/s", "$2"]
  - ['<ul class=\"css-1sirvy4\">(.*?)</ul>', '']
  - ['<em class=\"css-2fg4z9 e1gzwzxm0\">(.*?)</em>', '']
  - ['<hr(.*?)>', '']
  - ['<div id=\"bottom-wrapper\"(.*)$', '']
  - [' class=\"(.*?)\"', '']
  - ['>(Image|Video)/s", ">"]
  - ['</span>', '']
  - ['<span(.*?)>', '']
  - ['</section>', '']
  - ['<section(.*?)>', '']
  - ['</div>', '']
  - ['<div(.*?)>', '']
  - ['<p>\n</p>', '']
  - ['<a(.*?)>(.*?)</a>/s", "$2"]
  - ['<img(.*?)src=\"(.*?)\"(.*?)>/s", "<a target='_blank' href='$2'><img class='clImageThumb' src='$2'></a>"]
