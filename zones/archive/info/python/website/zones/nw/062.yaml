config_enabled  : "true"
config_type     : "link"

media_name      : "Chronicle.bg - Природа"
media_url       : "https://www.chr.bg/istorii/priroda/"
media_encode    : "false"
media_encoding  : ""

module_body     : "main[role=main]"
module_article  : "div[id*=post-]"
module_headline : "h3 a"

article_body    : "div[id=Story]"
article_title   : "h1 a"
article_date    : "time"
article_author  : ""

clean_module:
  - ['', '']

clean_article_pre:
  - ['', '']

clean_article_post:
  - ['<script(.*?)script>', '']
  - ['<style(.*?)style>', '']
  - ['<div id=\"div-inconent\">(.*?)</div>', '']
  - ['<div class=\"mobile-in-middle\">(.*?)</div>', '']
  - ['<div class=\"image-author-base\">(.*?)</div>', '']
  - ['<\!-- post title -->(.*?)<\!-- /post title -->', '']
  - ['<div class=\"addthis_sharing_toolbox\"(.*?)</div>', '']
  - ['<div class=\"col-xs-12 col-sm-3 p-0\">(.*?)</div>', '']
  - ['<div class=\"post-details\">(.*?)</div>', '']
  - ['<\!-- post details -->(.*?)<\!-- /post details -->', ''],//
  - ['<div class=\"col-xs-12 col-sm-9 p-0\">(.*?)</div>', '']
  - ['<div class=\"clearfix\">(.*?)</div>', '']
  - ['<div class=\"col-sm-6\">(.*?)</div>', '']
  - ['<div class=\"row\">(.*?)</div>', '']
  - ['<div class=\"related-container pull-right\">(.*?)</div>', '']
  - ['<div class=\"has-content-area\"(.*?)>(.*?)</div>(.*)/s", "$2"]
  - ['<div class=\"chronicle_gallery\"(.*?)>(.*?)</div>/s", "$2"]
  - ['<div class=\"center\"(.*)$', '']
  - ['<\!--(.*?)-->', '']
  - ['<div(.*?)>', '']
  - ['</div>', '']
  - ['<a(.*?)>(.*?)</a>/s", "$2"]
  - ['<img(.*?)src=\"(.*?)\"(.*?)>/s", "<a target='_blank' href='$2'><img class='clImageThumb' src='$2'></a><br>"]
