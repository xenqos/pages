config_enabled  : "true"
config_type     : "link"

media_name      : "Reuters - Finance"
media_url       : "https://www.reuters.com/business/finance/"
media_encode    : "false"
media_encoding  : ""

module_body     : "main"
module_article  : "div[class^=media-story-card__body]"
module_headline : "a[data-testid=Heading] span"

article_body    : "main"
article_title   : "h1"
article_date    : "time"
article_author  : "a[class^=author-name]"

clean_module:
  - ['<div class=\"media-story-card__body(.*?)>(\s+)<span(.*?)/span>(\s+)<a(.*?)/a>/s", "<div class=\"media-story-card__body\">"]
  - ['<a data-testid=\"Link\"(.*?)</a>', '']

clean_article_pre:
  - ['<!--(.*?)-->', '']
  - ['<script(.*?)script>', '']
  - ['Last Updated(.*?)ago', '']
  - ['(\d+) minute read', '']
  - ['<span(.*?)>(.*?)</span>/s", "<span>$2</span>"]
  - ['<span></span>', '']
  - ['<span>(.*?)</span>/s", "$1&emsp;"]

clean_article_post:
  - ['<noscript(.*?)>(.*?)</noscript>/s", "$2"]
  - ['<svg(.*?)>(.*?)</svg>', '']
  - ['<path(.*?)>(.*?)</path>', '']
  - ['<button(.*?)>(.*?)</button>', '']
  - ['^(.*?)</header>', '']
  - ['<div class=\"context-widget(.*?)\"(.*?)>(.*?)</div>', '']
  - ['<li class=\"toolbar-item(.*?)\"(.*?)>(.*?)</li>', '']
  - ['<ul class=\"toolbar-item(.*?)\"(.*?)>(.*?)</ul>', '']
  - ['<p(.*?)>(.*?)</p>/s", "<p>$2</p>"]
  - ['<h2(.*?)>(.*?)</h2>/s", "<h2>$2</h2>"]
  - ['<h3(.*?)>(.*?)</h3>/s", "<h3>$2</h3>"]
  - ['<h2>Read Next(.*)$', '']
  - ['read more', '']
  - ['<p>Our Standards(.*)$', '']
  - ['<span(.*?)>Reporting(.*?)</span>', '']
  - ['>Reporting by(.*?)</div>/s", "></div"]
  - ['</div>', '']
  - ['<div(.*?)>', '']
  - ['<b>\[(.*?)</b>', '']
  - ['<figcaption(.*?)>(.*?)</figcaption>/s", "$2<br><br>"]
  - ['<figure(.*?)>(.*?)</figure>/s", "$2"]
  - ['<a(.*?)>(.*?)</a>/s", "$2"]
  - ['<img(.*?)src=\"(.*?)\"(.*?)>/s", "<a target='_blank' href='$2'><img class='clImageThumb' src='$2'></a><br>"]
