<h2>Ticker Info</h2>
<h3>{$heading}</h3>
<div class='clClear'></div>
<table class='clOverflow'>
  <tr><th>Bid</th><th>Ask</th><th>Last</th></tr>
  <tr><td>{$tag_bid}</td><td>{$tag_ask}</td><td>{$tag_last}</td></tr>
</table>
<br>
<table class='clOverflow'>
  <tr><th></th><th>Today</th><th>24 hrs</th></tr>
  <tr><td>Open</td>  <td class='clRight'>{$tag_open}</td><td class='clRight'></td></tr>
  <tr><td>Low</td>   <td class='clRight'>{$tag_t_low}</td><td class='clRight'>{$tag_y_low}</td></tr>
  <tr><td>High</td>  <td class='clRight'>{$tag_t_high}</td><td class='clRight'>{$tag_y_high}</td></tr>
  <tr><td>Trades</td><td class='clRight'>{$tag_t_trades}</td><td class='clRight'>{$tag_y_trades}</td></tr>
  <tr><td>Volume</td><td class='clRight'>{$tag_t_volume}</td><td class='clRight'>{$tag_y_volume}</td></tr>
</table>
