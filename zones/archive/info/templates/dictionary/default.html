<!doctype html>
<html>
<head>
  <meta http-equiv='Content-Type' content='text/html; charset=UTF-8'>
  <meta name='viewport' content='width=device-width, user-scalable=no'>
  <title>{$title}</title>
  <link rel='stylesheet' type='text/css' media='screen' href='../styles/commons.css'>
  <link rel='stylesheet' type='text/css' media='screen' href='../styles/{$unit}.css'>
  {$media_css}
  <script type='text/javascript' src='../scripts/commons.js'></script>
  <script type='text/javascript' src='../scripts/{$unit}.js'></script>
</head>
<body onload='fncGetDivState(); fncGetScrollPosition();'>
<div id='idPanel'>
<div id='idTopbar'>
  <div id='idTopbarNavigation'>
    <a href='../index.html'><span class='clNavHome'></span></a>
    <a href='../{$zones}/{$zone}/index.html'><span class='clNavIndex'></span></a>

    <span id='idSearchBox'>
      <form method='get' action='{$prog}'>
        <input type='hidden' name='varDict' value='{$dict}'>
        <input id='idWord' type='text' name='varWord' value='{$word}' size='16'>
        <input id='idSearchSubmit' type='submit' value='   '>
        <input id='idSearchClear' type='text' onClick='document.getElementById( &quot;idWord&quot; ).value=&quot;&quot;; document.getElementById( &quot;idWord&quot; ).focus();'>
        <a href='{$media_url_word}' target='_blank' rel='noreferrer'><span class='clNavRight clNavRightDict'></span></a>
      </form>
    </span>

    </div>
</div>
<div id='idContent'>

<a target='_blank' href='{$media_url}'><div id='idDict'>{$media_name}</div></a>

<h1>{$word}</h1>

{$content}

</div>
</div>
</body>
</html>
